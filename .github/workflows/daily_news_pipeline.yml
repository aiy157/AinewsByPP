name: Ainews Daily AI News Pipeline

permissions:
  contents: read

on:
  # Triggered reliably every day at 04:15 AM ICT via external scheduler (cron-job.org)
  # calling GitHub REST API `/dispatches` (avoids GitHub native cron multi-hour delays).
  # Also supports manual runs from the GitHub Actions UI.
  workflow_dispatch:
    inputs:
      batch_type:
        description: 'DB cycle tag (auto detects midweek Mon-Thu / weekend Fri-Sun ICT)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - midweek
          - weekend
      lookback_hours:
        description: 'Lookback window in hours (1-168, default 28h = 24h + 4h overlap buffer)'
        required: false
        default: '28'
        type: string
      dry_run:
        description: 'Run in Dry-Run mode (live RSS/Community fetch only, $0 AI/DB write cost)'
        required: true
        default: false
        type: boolean

concurrency:
  group: ainews-daily-pipeline
  cancel-in-progress: false

jobs:
  run-news-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Execute Ainews Dry-Run (No Write Secrets)
        if: ${{ inputs.dry_run == true }}
        env:
          INPUT_BATCH_TYPE: ${{ inputs.batch_type || 'auto' }}
          INPUT_LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
          STAGE1_MODEL: ${{ vars.STAGE1_MODEL || 'claude-haiku-5-5' }}
          STAGE2_MODEL: ${{ vars.STAGE2_MODEL || 'claude-sonnet-5-5' }}
          DEFAULT_LOOKBACK_HOURS: '28'
          DEDUP_LOOKBACK_DAYS: '7'
          TIMEZONE: 'Asia/Bangkok'
          MAX_VERIFIED_ITEMS: '125'
          MAX_RUMOR_ITEMS: '25'
          STAGE1_MAX_INPUT_TOKENS_PER_CHUNK: '100000'
          ENABLE_OG_IMAGE_FETCH: 'true'
        run: |
          set -euo pipefail
          case "$INPUT_BATCH_TYPE" in
            auto|midweek|weekend) ;;
            *) echo "Invalid batch_type" >&2; exit 1 ;;
          esac
          args=(--batch-type "$INPUT_BATCH_TYPE" --dry-run)
          if [ -n "$INPUT_LOOKBACK_HOURS" ]; then
            if [[ ! "$INPUT_LOOKBACK_HOURS" =~ ^[0-9]{1,3}$ ]] || (( INPUT_LOOKBACK_HOURS < 1 || INPUT_LOOKBACK_HOURS > 168 )); then
              echo "Invalid lookback_hours (must be integer 1..168)" >&2
              exit 1
            fi
            args+=(--lookback-hours "$INPUT_LOOKBACK_HOURS")
          fi
          python -m pipeline.main "${args[@]}"

      - name: Execute Ainews Daily Pipeline (Production)
        if: ${{ inputs.dry_run != true }}
        env:
          INPUT_BATCH_TYPE: ${{ inputs.batch_type || 'auto' }}
          INPUT_LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          STAGE1_MODEL: ${{ vars.STAGE1_MODEL || 'claude-haiku-5-5' }}
          STAGE2_MODEL: ${{ vars.STAGE2_MODEL || 'claude-sonnet-5-5' }}
          STAGE2_THINKING_BUDGET: ${{ vars.STAGE2_THINKING_BUDGET || '4000' }}
          DEFAULT_LOOKBACK_HOURS: '28'
          DEDUP_LOOKBACK_DAYS: '7'
          BATCH_STAGE1_TIMEOUT_SECONDS: '1200'
          BATCH_STAGE2_TIMEOUT_SECONDS: '1200'
          BATCH_POLL_INTERVAL_SECONDS: '30'
          TIMEZONE: 'Asia/Bangkok'
          MAX_VERIFIED_ITEMS: '125'
          MAX_RUMOR_ITEMS: '25'
          STAGE1_MAX_INPUT_TOKENS_PER_CHUNK: '100000'
          REDDIT_MIN_SCORE: '20'
          REDDIT_MIN_COMMENTS: '5'
          ENABLE_OG_IMAGE_FETCH: 'true'
        run: |
          set -euo pipefail
          case "$INPUT_BATCH_TYPE" in
            auto|midweek|weekend) ;;
            *) echo "Invalid batch_type" >&2; exit 1 ;;
          esac
          args=(--batch-type "$INPUT_BATCH_TYPE")
          if [ -n "$INPUT_LOOKBACK_HOURS" ]; then
            if [[ ! "$INPUT_LOOKBACK_HOURS" =~ ^[0-9]{1,3}$ ]] || (( INPUT_LOOKBACK_HOURS < 1 || INPUT_LOOKBACK_HOURS > 168 )); then
              echo "Invalid lookback_hours (must be integer 1..168)" >&2
              exit 1
            fi
            args+=(--lookback-hours "$INPUT_LOOKBACK_HOURS")
          fi
          python -m pipeline.main "${args[@]}"

      - name: Upload Dry-Run Preview Artifact
        if: ${{ inputs.dry_run == true && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ainews-dry-run-preview
          path: pipeline/data/dry_run_preview.json
          if-no-files-found: ignore
          retention-days: 7
